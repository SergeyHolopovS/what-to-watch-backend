spring.application.name=what-to-watch
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

discord.oauth.client-id=${DISCORD_CLIENT_ID:}
discord.oauth.client-secret=${DISCORD_CLIENT_SECRET:}
discord.oauth.redirect-uri=${DISCORD_REDIRECT_URI:http://localhost:8080/auth/callback}
discord.oauth.scope=identify

cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# Список discordId через запятую. Пустой список = вход закрыт для всех.
auth.whitelist.discord-ids=${AUTH_WHITELIST_DISCORD_IDS:}

cookies.access-token-name=${COOKIES_ACCESS_TOKEN_NAME:access_token}
cookies.refresh-token-name=${COOKIES_REFRESH_TOKEN_NAME:refresh_token}
cookies.refresh-path=${COOKIES_REFRESH_PATH:/refresh}
cookies.same-site=${COOKIES_SAME_SITE:Lax}
# В prod (https) обязательно true
cookies.secure=${COOKIES_SECURE:false}

jwt.claims-names.token-pair-id-claim=${TOKEN_PAIR_ID_CLAIM:tokenPairId}
jwt.claims-names.token-type-claim=${TOKEN_TYPE_CLAIM:tokenType}
jwt.claims-names.access-token-type=${ACCESS_TOKEN_TYPE:access}
jwt.claims-names.refresh-token-type=${REFRESH_TOKEN_TYPE:refresh}

# ВНИМАНИЕ: ключи ниже — только для локальной разработки, они лежат в репозитории
# в открытом виде. В prod обязательно задайте JWT_PRIVATE_KEY / JWT_PUBLIC_KEY.
jwt.keys.private-key=${JWT_PRIVATE_KEY:MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgv/p1NpJmKYDLnfnVfBKyx/D4bBN5WxPooVAZALiU+rGhRANCAATaNtTOuwKnJxGkOhhnMPfgeb1NtvrrBd8hTT+v0lEkBwrfqo0YXyAEstGYvmAsxCfrMJy+lhr8NBIeUOyHVXr0}
jwt.keys.public-key=${JWT_PUBLIC_KEY:MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2jbUzrsCpycRpDoYZzD34Hm9Tbb66wXfIU0/r9JRJAcK36qNGF8gBLLRmL5gLMQn6zCcvpYa/DQSHlDsh1V69A==}

jwt.expiration.access-expiration=${JWT_ACCESS_EXPIRATION:900}
jwt.expiration.refresh-expiration=${JWT_REFRESH_EXPIRATION:864000}

# Периодичность удаления протухших refresh токенов, в часах
jwt.schedule.refresh-autodelete-rate=${REFRESH_TOKEN_AUTODELETE_RATE:1}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/what_to_watch}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

server.port=${APP_PORT:8080}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs
