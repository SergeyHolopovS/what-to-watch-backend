# Профиль для тестов, поднимающих контекст: БД в памяти вместо Postgres.
spring.datasource.url=jdbc:h2:mem:what_to_watch;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

auth.whitelist.discord-ids=1
